[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",  # Import placement and structure
    "E7",  # Statement-related errors
    "E9",  # Syntax and runtime errors
    "F",   # Pyflakes correctness checks
    "I",   # Import sorting
    "B",   # Likely bugs from flake8-bugbear
    "UP",  # Modern Python syntax
    "RUF", # Ruff-specific correctness checks
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true